<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ylopo Lead Stats</title>
  <style>
    :root {
      --page-bg: #f7f7f8;
      --card-bg: #fafafa;
      --card-border: #d8d8dc;
      --card-border-active: #a8a8b0;
      --text-dark: #1f2430;
      --text-muted: #868b95;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text-dark);
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    .ylopo-page {
      max-width: 780px;
      margin: 48px auto 0;
      padding: 0 12px;
    }

    .ylopo-stats-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .ylopo-stat-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 10px 9px;
      min-height: 94px;
      text-align: left;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ylopo-stat-card.is-active {
      border-color: var(--card-border-active);
      box-shadow: 0 0 0 1px rgba(145, 146, 153, 0.15);
    }

    .ylopo-stat-title {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3a3f48;
      line-height: 1.3;
      min-height: 25px;
    }

    .ylopo-stat-value {
      margin-top: 7px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 34px;
      font-weight: 600;
      line-height: 1;
      color: #1f2430;
    }

    .ylopo-stat-icon {
      font-size: 24px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
    }

    .ylopo-stat-number {
      font-size: 35px;
      letter-spacing: -0.02em;
    }

    .ylopo-stat-subtext {
      margin-top: 8px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .ylopo-anon-row {
      margin-top: 8px;
      width: calc((100% - 48px) / 7);
      min-width: 101px;
    }

    .ylopo-hidden-section {
      display: none;
    }

    @media (max-width: 920px) {
      .ylopo-stats-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .ylopo-anon-row {
        width: calc((100% - 24px) / 4);
      }
    }

    @media (max-width: 560px) {
      .ylopo-stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .ylopo-anon-row {
        width: calc((100% - 8px) / 2);
      }
    }
  </style>
</head>
<body>
  <div class="ylopo-page">
    <div class="ylopo-stats-grid" id="ylopoStatsGrid"></div>
    <div class="ylopo-anon-row" id="ylopoAnonWrap"></div>

    <section id="ylopo-activity-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-listings-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-recentsearches-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-savedpt-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-searches-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-viewedsavedlink-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-newleads-section" class="ylopo-hidden-section"></section>
    <section id="ylopo-anonymous-section" class="ylopo-hidden-section"></section>
  </div>

  <script>
    const statCards = [
      { key: "activity", label: "Latest Activity", icon: "⚡", value: 0, subtext: "Last 30 days", active: true },
      { key: "listings", label: "Listings Views", icon: "👁️", value: 0, subtext: "Last 30 days" },
      { key: "recentsearches", label: "Recent Searches", icon: "🔍", value: 0, subtext: "Last 30 days" },
      { key: "savedpt", label: "Saved Properties", icon: "❤", value: 0, subtext: "Last 30 days" },
      { key: "searches", label: "Saved Searches", icon: "🔎", value: 0, subtext: "Last 30 days" },
      { key: "viewedsavedlink", label: "Viewed Saved Link", icon: "🔗", value: 0, subtext: "Last 30 days" },
      { key: "newleads", label: "New Leads", icon: "👥", value: 0, subtext: "Last 30 days" },
      { key: "anonymous", label: "Anonymous", icon: "👤", value: 0, subtext: "Last 30 days" }
    ];

    function createStatCard(card, isCompact = false) {
      const cardEl = document.createElement("article");
      cardEl.className = `ylopo-stat-card${card.active ? " is-active" : ""}`;
      cardEl.setAttribute("data-key", card.key);
      cardEl.innerHTML = `
        <div class="ylopo-stat-title">${card.label}</div>
        <div class="ylopo-stat-value">
          <span class="ylopo-stat-icon">${card.icon}</span>
          <span class="ylopo-stat-number">${card.value}</span>
        </div>
        <div class="ylopo-stat-subtext">${card.subtext}</div>
      `;
      if (isCompact) {
        cardEl.classList.remove("is-active");
      }
      return cardEl;
    }

    function renderStats() {
      const statsGrid = document.getElementById("ylopoStatsGrid");
      const anonWrap = document.getElementById("ylopoAnonWrap");

      const mainCards = statCards.filter((card) => card.key !== "anonymous");
      const anonymousCard = statCards.find((card) => card.key === "anonymous");

      mainCards.forEach((card) => {
        statsGrid.appendChild(createStatCard(card));
      });

      if (anonymousCard) {
        anonWrap.appendChild(createStatCard(anonymousCard, true));
      }
    }

    renderStats();
  </script>
</body>
</html>
